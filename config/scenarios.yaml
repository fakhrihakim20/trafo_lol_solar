# Scenario definitions for Monte Carlo sweep
# Named scenarios for paper narrative; full grid is generated programmatically
# in src/transformer_lol/scenarios.py

# Monte Carlo settings (apply to all scenarios unless overridden)
mc_defaults:
  n_runs: 1000
  base_seed: 42
  simulation_years: 1
  dt_min: 60.0        # timestep in minutes (hourly for MC; 15-min for training data)
  inverter_thd: 0.05         # inverter harmonic distortion fraction; R_eff = R*(1+0.5*THD²) per IEC 61378-1
  reverse_flow_loss_uplift: 0.0  # headline runs: no measured directional reverse-flow loss; set >0 for sensitivity
  cooling_failure_mode: "none"  # "none" = fans always ok; "fan_failed" = always ONAN
  ev_slow_penetration_pu: 0.0   # slow overnight EV charging peak load [p.u. of rated MVA]
  ev_fast_penetration_pu: 0.0   # fast opportunistic EV charging peak load [p.u.]
  dispatch_method: "threshold"  # "threshold" (heuristic, fast) | "pypsa_lp" (Phase 4B optimisation)
  pypsa_solver: "highs"         # solver passed to pypsa.Network.optimize() when dispatch_method=pypsa_lp

# Named scenarios — human-readable labels for paper figures
scenarios:
  baseline:
    pv_penetration: 0.0
    ambient_delta_c: 0.0
    load_growth_pct_per_year: 0.0
    description: "Present-day, no PV"

  pv10_tropical_today:
    pv_penetration: 0.10
    ambient_delta_c: 0.0
    load_growth_pct_per_year: 0.0
    description: "10% PV, today's climate"

  pv30_tropical_today:
    pv_penetration: 0.30
    ambient_delta_c: 0.0
    load_growth_pct_per_year: 0.0
    description: "30% PV, today's climate"

  pv50_tropical_today:
    pv_penetration: 0.50
    ambient_delta_c: 0.0
    load_growth_pct_per_year: 0.0
    description: "50% PV, today's climate"

  pv75_tropical_today:
    pv_penetration: 0.75
    ambient_delta_c: 0.0
    load_growth_pct_per_year: 0.0
    description: "75% PV, today's climate"

  pv30_warmer_2030:
    pv_penetration: 0.30
    ambient_delta_c: 1.0
    load_growth_pct_per_year: 4.5
    description: "30% PV, +1°C ambient, 4.5%/yr load growth (2030 scenario)"

  pv50_warmer_2030:
    pv_penetration: 0.50
    ambient_delta_c: 1.0
    load_growth_pct_per_year: 4.5
    description: "50% PV, +1°C ambient, 4.5%/yr load growth (2030 scenario)"

  pv50_warmer_2040:
    pv_penetration: 0.50
    ambient_delta_c: 2.0
    load_growth_pct_per_year: 4.5
    description: "50% PV, +2°C ambient, 4.5%/yr load growth (2040 scenario)"

  # Phase 3 new scenarios: EV + battery
  pv50_ev30_today:
    pv_penetration: 0.50
    ev_slow_penetration_pu: 0.20
    ev_fast_penetration_pu: 0.10
    description: "50% PV, 30% EV (20% slow + 10% fast), today's climate"

  pv75_battery5mwh_today:
    pv_penetration: 0.75
    battery_capacity_mwh: 5.0
    battery_power_mw: 2.0
    description: "75% PV, 5 MWh / 2 MW battery, today's climate"

  pv75_battery5mwh_ev30_warmer_2030:
    pv_penetration: 0.75
    ambient_delta_c: 1.0
    load_growth_pct_per_year: 4.5
    ev_slow_penetration_pu: 0.20
    ev_fast_penetration_pu: 0.10
    battery_capacity_mwh: 5.0
    battery_power_mw: 2.0
    description: "75% PV + 5 MWh battery + 30% EV, +1°C, 4.5%/yr (2030)"

# Full programmatic grid (generated by scenarios.py — do not edit manually)
# PV levels (fraction of rated MVA): [0.0, 0.10, 0.30, 0.50, 0.75]
# Ambient delta (°C):                [0.0, 1.0, 2.0]
# Load growth (%/yr):                [0.0, 4.5]
# Total: 5 × 3 × 2 = 30 scenarios
grid:
  pv_levels:       [0.0, 0.10, 0.30, 0.50, 0.75]
  ambient_deltas:  [0.0, 1.0, 2.0]
  load_growths:    [0.0, 4.5]
