name: Deploy companion website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'results/metrics.json'
      - 'results/tables/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # The repo is served from https://<user>.github.io/trafo_lol_solar/
          # so every asset and fetch URL must be prefixed with this path.
          NEXT_PUBLIC_BASE_PATH: /trafo_lol_solar
        run: npm run build

      - name: Disable Jekyll on the artifact
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
