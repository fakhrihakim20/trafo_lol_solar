[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer_lol"
version = "0.1.0"
description = "IEEE C57.91 transformer loss-of-life simulation under rooftop-PV scenarios"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2,<3.0",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "pypsa>=0.27",
    "linopy>=0.3",
    "highspy>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
